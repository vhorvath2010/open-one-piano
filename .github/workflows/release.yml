name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: open-one-piano-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: open-one-piano-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: open-one-piano-macos-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: open-one-piano-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libxkbcommon-dev libgl1-mesa-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/open-one-piano.exe dist/
          cp README.md LICENSE dist/
          cd dist && 7z a ../${{ matrix.name }}.zip .

      - name: Package (macOS app)
        if: runner.os == 'macOS'
        run: |
          APP="dist/Open ONE Piano.app"
          mkdir -p "$APP/Contents/MacOS"
          cp target/${{ matrix.target }}/release/open-one-piano "$APP/Contents/MacOS/"
          cp packaging/macos/Info.plist "$APP/Contents/"
          codesign --force --deep --sign - "$APP"
          cp README.md LICENSE dist/
          cd dist && zip -r ../${{ matrix.name }}.zip .

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/open-one-piano dist/
          cp README.md LICENSE dist/
          tar -czf ${{ matrix.name }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match Cargo.toml version
        # The in-app updater compares the release tag with the built-in version;
        # a mismatch would offer the same update forever.
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} doesn't match Cargo.toml version $v"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
